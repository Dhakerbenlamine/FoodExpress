<section class="container py-5">
  <app-admin-nav></app-admin-nav>
  <h1 class="h2 mb-4">Statistiques générales</h1>
  <div class="row g-3" *ngIf="stats">
    <div class="col-sm-6 col-lg-3"><div class="card text-center"><div class="card-body"><h2 class="h6">Clients</h2><strong class="h3">{{ stats.nombreClients }}</strong></div></div></div>
    <div class="col-sm-6 col-lg-3"><div class="card text-center"><div class="card-body"><h2 class="h6">Restaurants</h2><strong class="h3">{{ stats.nombreRestaurants }}</strong></div></div></div>
    <div class="col-sm-6 col-lg-3"><div class="card text-center"><div class="card-body"><h2 class="h6">Commandes</h2><strong class="h3">{{ stats.nombreCommandes }}</strong></div></div></div>
    <div class="col-sm-6 col-lg-3"><div class="card text-center"><div class="card-body"><h2 class="h6">Chiffre d’affaires</h2><strong class="h3">{{ stats.chiffreAffairesGlobal }} DT</strong></div></div></div>
  </div>
</section>
