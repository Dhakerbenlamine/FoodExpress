<section class="container py-5">
  <app-admin-nav></app-admin-nav>
  <div class="page-heading"><span class="text-uppercase small fw-bold text-success">Vue d’ensemble</span><h1 class="h2 mt-1">Statistiques FoodExpress</h1><p>Un aperçu de l’activité de votre plateforme.</p></div>
  <div class="row g-3" *ngIf="stats">
    <div class="col-sm-6 col-lg-3"><div class="card stat-card"><div class="card-body"><i class="bi bi-people stat-icon"></i><h2 class="h6 mt-3">Clients</h2><strong class="display-6">{{ stats.nombreClients }}</strong></div></div></div>
    <div class="col-sm-6 col-lg-3"><div class="card stat-card"><div class="card-body"><i class="bi bi-shop stat-icon"></i><h2 class="h6 mt-3">Restaurants</h2><strong class="display-6">{{ stats.nombreRestaurants }}</strong></div></div></div>
    <div class="col-sm-6 col-lg-3"><div class="card stat-card"><div class="card-body"><i class="bi bi-receipt stat-icon"></i><h2 class="h6 mt-3">Commandes</h2><strong class="display-6">{{ stats.nombreCommandes }}</strong></div></div></div>
    <div class="col-sm-6 col-lg-3"><div class="card stat-card"><div class="card-body"><i class="bi bi-cash-coin stat-icon"></i><h2 class="h6 mt-3">Chiffre d’affaires global</h2><strong class="h2">{{ stats.chiffreAffairesGlobal }} DT</strong></div></div></div>
  </div>
</section>
