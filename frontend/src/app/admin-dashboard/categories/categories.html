<section class="container py-5">
  <h1 class="h2 mb-4">Gestion des catégories</h1>
  <div class="card mb-4"><div class="card-body row g-3">
    <div class="col-md-4"><select class="form-select" [(ngModel)]="restaurantId"><option value="">Restaurant</option><option *ngFor="let restaurant of restaurants" [value]="restaurant._id">{{ restaurant.nom }}</option></select></div>
    <div class="col-md-4"><input class="form-control" [(ngModel)]="nom" placeholder="Nom de la catégorie"></div>
    <div class="col-md-4"><button class="btn btn-success w-100" (click)="save()">Ajouter</button></div>
  </div></div>
  <ul class="list-group">
    <li class="list-group-item d-flex justify-content-between" *ngFor="let category of categories">
      <span>{{ category.nom }}</span>
      <button class="btn btn-sm btn-outline-danger" (click)="remove(category)">Supprimer</button>
    </li>
  </ul>
</section>
