<section class="container py-5">
  <h1 class="h2 mb-4">Mes commandes</h1>
  <div *ngIf="loading">Chargement...</div>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  <div class="card mb-3" *ngFor="let order of orders">
    <div class="card-body">
      <div class="d-flex justify-content-between flex-wrap gap-2">
        <h2 class="h5 mb-0">{{ order.restaurant?.nom || 'Restaurant' }}</h2>
        <span class="badge text-bg-success">{{ order.statut }}</span>
      </div>
      <p class="mt-2 mb-1">Adresse : {{ order.adresseLivraison }}</p>
      <p class="mb-1" *ngFor="let article of order.articles">{{ article.quantite }} × {{ article.nom }} · {{ article.prixUnitaire }} DT</p>
      <strong>Total : {{ order.total }} DT</strong>
    </div>
  </div>
  <div *ngIf="!loading && !error && orders.length===0" class="alert alert-light border">Aucune commande.</div>
</section>
