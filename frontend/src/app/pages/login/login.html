<section class="container py-5 auth-page">
  <div class="row justify-content-center align-items-stretch g-0 auth-card">
    <div class="col-lg-5 auth-visual">
      <img src="/food-placeholder.svg" alt="" class="auth-illustration">
      <span class="badge rounded-pill bg-light text-success">Bienvenue chez FoodExpress</span>
      <h2 class="h2 text-white mt-3">Le plaisir de bien manger, en toute simplicité.</h2>
      <p class="text-white-50 mb-0">Connectez-vous pour retrouver vos commandes et vos restaurants préférés.</p>
    </div>
    <div class="col-lg-7 auth-form">
      <span class="text-uppercase small fw-bold text-success">Heureux de vous revoir</span>
      <h1 class="h2 mt-2 mb-4">Connexion</h1>
      <div *ngIf="notice" class="alert alert-warning">{{ notice }}</div>
      <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
      <form (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label" for="login-email">Adresse e-mail</label>
          <input id="login-email" type="email" class="form-control" [(ngModel)]="email" name="email" autocomplete="email" placeholder="nom@exemple.com" required>
        </div>
        <div class="mb-4">
          <label class="form-label" for="login-password">Mot de passe</label>
          <input id="login-password" type="password" class="form-control" [(ngModel)]="password" name="password" autocomplete="current-password" placeholder="Votre mot de passe" required>
        </div>
        <button class="btn btn-success w-100" type="submit"><i class="bi bi-box-arrow-in-right me-2"></i>Se connecter</button>
      </form>
      <p class="mt-4 mb-0 text-center text-secondary">Pas encore de compte ? <a class="fw-semibold" routerLink="/register">Créer un compte</a></p>
    </div>
  </div>
</section>
