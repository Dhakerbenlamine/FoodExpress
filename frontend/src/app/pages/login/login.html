<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow-sm"><div class="card-body p-4">
        <h1 class="h3 mb-4">Connexion</h1>
        <div *ngIf="notice" class="alert alert-warning">{{ notice }}</div>
        <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
        <form (ngSubmit)="submit()">
          <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" [(ngModel)]="email" name="email" required></div>
          <div class="mb-3"><label class="form-label">Mot de passe</label><input type="password" class="form-control" [(ngModel)]="password" name="password" required></div>
          <button class="btn btn-success w-100" type="submit">Se connecter</button>
        </form>
        <p class="mt-3 mb-0 text-center">Pas de compte ? <a routerLink="/register">S'inscrire</a></p>
      </div></div>
    </div>
  </div>
</section>
