<section class="container py-5">
  <h1 class="h2 mb-4">Confirmation de commande</h1>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  <div class="row g-4">
    <div class="col-lg-7">
      <div class="card">
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">Adresse de livraison</label>
            <input class="form-control" [(ngModel)]="adresseLivraison" name="adresse" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Remarque</label>
            <textarea class="form-control" [(ngModel)]="remarque" name="remarque" rows="3"></textarea>
          </div>
          <div>
            <label class="form-label">Mode de paiement</label>
            <select class="form-select" [(ngModel)]="modePaiement" name="modePaiement">
              <option value="livraison">Paiement à la livraison</option>
              <option value="en_ligne">Paiement en ligne</option>
            </select>
          </div>
        </div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="card">
        <div class="card-body">
          <h2 class="h5">Récapitulatif</h2>
          <div class="d-flex justify-content-between"><span>Sous-total</span><strong>{{ sousTotal }} DT</strong></div>
          <button class="btn btn-success w-100 mt-3" (click)="confirm()" [disabled]="loading || !adresseLivraison.trim()">
            {{ loading ? 'Confirmation...' : 'Confirmer la commande' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
