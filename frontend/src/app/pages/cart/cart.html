<section class="container py-5">
  <h1 class="h2 mb-4">Mon panier</h1>
  <div *ngIf="items.length===0" class="alert alert-light border">
    Votre panier est vide.
    <a routerLink="/restaurants">Découvrir les restaurants</a>
  </div>
  <div class="row g-4" *ngIf="items.length>0">
    <div class="col-lg-8">
      <div class="card mb-3" *ngFor="let item of items">
        <div class="card-body d-flex justify-content-between align-items-center gap-3">
          <div>
            <h2 class="h6 mb-1">{{ item.nom }}</h2>
            <span>{{ item.prix }} DT / unité</span>
          </div>
          <div class="d-flex align-items-center gap-2">
            <button class="btn btn-outline-secondary" (click)="decrement(item)">-</button>
            <strong>{{ item.quantite }}</strong>
            <button class="btn btn-outline-secondary" (click)="increment(item)">+</button>
            <button class="btn btn-outline-danger" (click)="remove(item)"><i class="bi bi-trash"></i></button>
          </div>
        </div>
      </div>
    </div>
    <aside class="col-lg-4">
      <div class="card">
        <div class="card-body">
          <h2 class="h5">Récapitulatif</h2>
          <div class="d-flex justify-content-between"><span>Sous-total</span><strong>{{ sousTotal }} DT</strong></div>
          <hr>
          <a class="btn btn-success w-100" routerLink="/checkout">Passer la commande</a>
        </div>
      </div>
    </aside>
  </div>
</section>
