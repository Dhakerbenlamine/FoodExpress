<section class="container py-5">
  <div class="page-heading"><span class="text-uppercase small fw-bold text-success">Espace personnel</span><h1 class="h2 mt-1">Mon profil</h1><p>Gardez vos coordonnées à jour et gérez votre session.</p></div>
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card profile-card">
        <div class="card-body p-4 p-md-5">
          <div class="profile-avatar mb-4"><i class="bi bi-person"></i></div>
          <div *ngIf="message" class="alert alert-success">{{ message }}</div>
          <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
          <form (ngSubmit)="update()">
            <div class="mb-3"><label class="form-label" for="profile-nom">Nom</label><input id="profile-nom" class="form-control" [(ngModel)]="nom" name="nom"></div>
            <div class="mb-3"><label class="form-label" for="profile-prenom">Prénom</label><input id="profile-prenom" class="form-control" [(ngModel)]="prenom" name="prenom"></div>
            <div class="mb-4"><label class="form-label" for="profile-phone">Téléphone</label><input id="profile-phone" class="form-control" [(ngModel)]="telephone" name="telephone"></div>
            <div class="d-flex flex-wrap gap-2">
              <button class="btn btn-success" type="submit"><i class="bi bi-check2 me-2"></i>Enregistrer les modifications</button>
              <button class="btn btn-outline-danger" type="button" (click)="logout()"><i class="bi bi-box-arrow-right me-2"></i>Se déconnecter</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
